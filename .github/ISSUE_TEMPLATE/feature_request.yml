name: Feature request
description: Suggest an improvement or new feature for the integration.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the Zehnder ConnectBox integration.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain how this change would help and which device you use.
    validations:
      required: true
