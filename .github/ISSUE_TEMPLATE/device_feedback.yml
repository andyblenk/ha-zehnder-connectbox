name: Device compatibility feedback
description: Help verify a ConnectBox ventilation unit, especially ComfoAir 70.
title: "[Device]: "
labels:
  - device-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve device support. Please use only the sanitized diagnostics generated by the integration.
  - type: input
    id: product
    attributes:
      label: Product name
      placeholder: ComfoAir 70
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Test results
      description: Which entities appear, and which controls have you verified?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Attach the diagnostics downloaded from Home Assistant after reviewing them.

